# Builds the DevotionLock Xcode project on every push/PR to main.
# Verifies Swift compiles, SPM resolves, and the widget extension links.
#
# CI uses base entitlements (no Family Controls) + CODE_SIGNING_ALLOWED=NO so we
# don't need Apple signing secrets. Device/TestFlight builds still use
# DevotionLock.family-controls.entitlements locally.

name: iOS Build

on:
  push:
    branches: [main, github-actions]
  pull_request:
    branches: [main]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # InAppKit → MockableMacro; same fix as ci_scripts/ci_post_clone.sh (Xcode Cloud).
      - name: Allow Swift macros in CI
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project devotionlock-mobile.xcodeproj \
            -scheme DevotionLock

      - name: Build app + widget (Simulator)
        run: |
          xcodebuild build \
            -project devotionlock-mobile.xcodeproj \
            -scheme DevotionLock \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=DevotionLock/DevotionLock.entitlements \
            ONLY_ACTIVE_ARCH=NO
        env:
          NSUnbufferedIO: YES
